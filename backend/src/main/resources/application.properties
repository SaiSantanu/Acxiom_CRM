# ==============================================================================
# AcxiomCRM Backend Configuration
# ==============================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=

# Optional local environment import from .env (kept outside VCS for security)
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Database Configuration (Externalized with environment / .env resolution)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/acxiom_crm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# CORS Allowed Origins
crm.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging
logging.level.root=INFO
logging.level.com.acxiom.crm=DEBUG
